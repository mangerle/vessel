name: "测试跨仓库 Release API"

on:
  push:
    tags:
      - "test-v*"

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 测试同步 Tag 到公开仓库
        run: |
          git remote add target https://oauth2:${{ secrets.CROSS_REPO_RELEASE_TOKEN }}@github.com/mangerle/vesselApp.git
          git push -f target ${{ github.ref_name }}

      - name: 测试创建 Release API
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.CROSS_REPO_RELEASE_TOKEN }}
          repository: mangerle/vesselApp
          tag_name: ${{ github.ref_name }}
          name: "Test Release ${{ github.ref_name }}"
          body: "这是一个极速测试跨仓库 API 创建的 Release，不包含二进制编译产物"
          draft: false
          prerelease: false
