name: "自动加签发布 Release"

on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Generate Release Notes
        id: release_notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. 尝试获取当前源码仓库针对本次 Tag 自动生成的 Release Notes
          body=$(gh api repos/${{ github.repository }}/releases/generate-notes -f tag_name=${{ github.ref_name }} --jq .body 2>/dev/null)
          
          # 2. 如果获取成功，过滤掉包含 "chore(release):" 的版本升级行；如果失败，使用默认文本兜底
          if [ -n "$body" ]; then
            body=$(echo "$body" | grep -v -E "chore\(release\):")
          else
            body="Vessel 自动加签构建版本"
          fi
          
          # 3. 将多行文本安全写入 GitHub 环境变量输出
          echo "BODY<<EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          # 使用具有公开分发仓库写入权限的 PAT
          GITHUB_TOKEN: ${{ secrets.CROSS_REPO_RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Vessel ${{ github.ref_name }}"
          releaseBody: ${{ steps.release_notes.outputs.BODY }}
          releaseDraft: false
          prerelease: false
          owner: mangerle
          repo: vesselApp
          releaseCommitish: 'main'
