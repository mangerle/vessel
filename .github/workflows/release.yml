name: "自动加签发布 Release"

on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Sync Git Tag to Public Repo
        shell: bash
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_RELEASE_TOKEN }}
        run: |
          git config --local --unset http.https://github.com/.extraheader || true
          git remote add target https://oauth2:${CROSS_REPO_TOKEN}@github.com/mangerle/vesselApp.git
          git -c credential.helper= push -f target ${{ github.ref_name }}

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          # 使用具有公开分发仓库写入权限的 PAT
          GITHUB_TOKEN: ${{ secrets.CROSS_REPO_RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Vessel ${{ github.ref_name }}"
          releaseBody: "Vessel 自动加签构建版本"
          releaseDraft: false
          prerelease: false
          owner: mangerle
          repo: vesselApp
